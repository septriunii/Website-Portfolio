<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.8" flood-color="#ffffff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#halo)">
    <!-- Square Edge in obsidian #0a0a0a with transparent interior -->
