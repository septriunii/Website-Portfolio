    <!-- Centered Capital Letter "A" in obsidian #0a0a0a -->
    <path fill="#0a0a0a" fill-rule="evenodd" d="M 29.5 16 H 34.5 L 49 48 H 42.5 L 39.5 40 H 24.5 L 21.5 48 H 15 Z M 32 22.5 L 37 34.5 H 27 Z"/>
  </g>
</svg>